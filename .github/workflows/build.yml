name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk BitacoraFlotilla.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BitacoraFlotilla-apk
          path: BitacoraFlotilla.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: Bitácora Flotilla 3.1.${{ github.run_number }}
          body: "v3.1 · apunta a la nueva implementación del servicio de Google. · cada persona que instala la app se registra (nombre, No. de empleado, correo y placas) y obtiene su propia bitácora en Google Sheets, compartida a su correo. Requiere actualizar Code.gs (versión 5)."
          files: BitacoraFlotilla.apk
          make_latest: true
