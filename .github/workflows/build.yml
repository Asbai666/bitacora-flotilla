name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk BitacoraFlotilla.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BitacoraFlotilla-apk
          path: BitacoraFlotilla.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.${{ github.run_number }}
          name: Bitácora Flotilla 4.4 · por Asbai Jiménez (AJM) · ${{ github.run_number }}
          body: "Bitácora Flotilla 4.4 · por Asbai Jiménez (AJM). En Registros, las filas con campos vacíos salen en rojo con la lista de lo que falta, filtro Ver solo incompletos, y al abrirlas los campos faltantes se marcan en rojo para completarlos. Requiere Code.gs versión 9."
          files: BitacoraFlotilla.apk
          make_latest: true
