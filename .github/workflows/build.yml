name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk BitacoraFlotilla.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BitacoraFlotilla-apk
          path: BitacoraFlotilla.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.${{ github.run_number }}
          name: Bitácora Flotilla 2.4.${{ github.run_number }}
          body: "v2.4 · mini mapa con el recorrido del día (salida, paradas numeradas y ubicación actual) y tarjetas de km recorridos, rendimiento km/L del mes, litros y gasto estimados del día."
          files: BitacoraFlotilla.apk
          make_latest: true
